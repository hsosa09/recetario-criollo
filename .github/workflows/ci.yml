# Compila y corre los tests unitarios en cada push a main y en cada PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitarios y build de debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint de release
        run: ./gradlew :app:lintRelease

      - name: APK de debug
        run: ./gradlew :app:assembleDebug

      # Play exige páginas de 16 KB; una dependencia nativa desalineada abre la app en modo compatible (#54).
      - name: Compatibilidad con páginas de 16 KB
        run: python3 .github/scripts/revisar_16kb.py app/build/outputs/apk/debug/app-debug.apk

      - name: Resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tests
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: recetario-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  instrumentados:
    name: Tests instrumentados (migraciones y DAOs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador API 34 y tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Sin caché de configuración: AGP 9.3 a veces no la puede serializar para androidTest (#29).
          script: ./gradlew :app:connectedDebugAndroidTest --no-configuration-cache

      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-instrumentados
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
